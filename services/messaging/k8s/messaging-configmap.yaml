apiVersion: v1
kind: ConfigMap
metadata:
  name: messaging-config
  labels:
    app: groupsapp-messaging
data:
  SERVICE_NAME: groupsapp-messaging
  ENVIRONMENT: production
  API_HOST: 0.0.0.0
  API_PORT: "8080"
  GRPC_HOST: 0.0.0.0
  GRPC_PORT: "50051"
  RABBITMQ_EXCHANGE: groupsapp.events
  ATTACHMENT_ROOT: /var/lib/groupsapp/attachments
  MAX_UPLOAD_MB: "100"
