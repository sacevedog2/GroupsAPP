apiVersion: apps/v1
kind: Deployment
metadata:
  name: groupsapp-messaging
  labels:
    app: groupsapp-messaging
spec:
  replicas: 2
  selector:
    matchLabels:
      app: groupsapp-messaging
  template:
    metadata:
      labels:
        app: groupsapp-messaging
    spec:
      containers:
        - name: messaging
          image: <aws_account_id>.dkr.ecr.<region>.amazonaws.com/groupsapp-messaging:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 50051
          envFrom:
            - configMapRef:
                name: messaging-config
            - secretRef:
                name: messaging-secrets
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: attachments
              mountPath: /var/lib/groupsapp/attachments
      volumes:
        - name: attachments
          persistentVolumeClaim:
            claimName: messaging-attachments-pvc
