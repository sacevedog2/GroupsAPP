version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: groupsapp
      POSTGRES_PASSWORD: groupsapp
      POSTGRES_DB: groupsapp_auth
    ports:
      - "5432:5432"
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U groupsapp -d groupsapp_auth"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"
      - "15672:15672"

  auth:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://groupsapp:groupsapp@postgres:5432/groupsapp_auth
    ports:
      - "8081:8081"
      - "50052:50052"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started

volumes:
  postgres_auth_data:
