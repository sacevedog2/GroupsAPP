apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: groupsapp-auth-hpa
  labels:
    app: groupsapp-auth
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: groupsapp-auth
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
