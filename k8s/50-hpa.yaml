apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: groupsapp-auth-hpa
  namespace: groupsapp
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: groupsapp-auth
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
