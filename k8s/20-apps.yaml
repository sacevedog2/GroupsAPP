apiVersion: apps/v1
kind: Deployment
metadata:
  name: groupsapp-auth
  namespace: groupsapp
  labels:
    app: groupsapp-auth
spec:
  replicas: 2
  selector:
    matchLabels:
      app: groupsapp-auth
  template:
    metadata:
      labels:
        app: groupsapp-auth
    spec:
      containers:
        - name: auth
          image: 992646667898.dkr.ecr.us-east-1.amazonaws.com/auth-groupsapp:v1
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8081
            - name: grpc
              containerPort: 50051
          env:
            - name: SERVICE_NAME
              value: groupsapp-auth
            - name: ENVIRONMENT
              value: production
            - name: API_HOST
              value: 0.0.0.0
            - name: API_PORT
              value: "8081"
            - name: GRPC_HOST
              value: 0.0.0.0
            - name: GRPC_PORT
              value: "50051"
            - name: JWT_ISSUER
              value: groupsapp-auth
            - name: ACCESS_TOKEN_TTL_SECONDS
              value: "3600"
            - name: PASSWORD_PBKDF2_ITERATIONS
              value: "310000"
            - name: RABBITMQ_EXCHANGE
              value: groupsapp.events
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: auth-db-secret
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: auth-db-secret
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: auth-db-secret
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: auth-db-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: auth-db-secret
                  key: DB_PASSWORD
            - name: DATABASE_URL
              value: postgresql+asyncpg://$(DB_USER):$(DB_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(DB_NAME)?ssl=require
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: auth-jwt-secret
                  key: JWT_SECRET_KEY
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secret
                  key: RABBITMQ_USER
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secret
                  key: RABBITMQ_PASSWORD
            - name: RABBITMQ_URL
              value: amqp://$(RABBITMQ_USER):$(RABBITMQ_PASSWORD)@groupsapp-rabbitmq:5672/
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 750m
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: groupsapp-auth
  namespace: groupsapp
  labels:
    app: groupsapp-auth
spec:
  type: ClusterIP
  selector:
    app: groupsapp-auth
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: grpc
      port: 50051
      targetPort: grpc
---
