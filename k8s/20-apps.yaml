apiVersion: apps/v1
kind: Deployment
metadata:
  name: groupsapp-frontend
  namespace: groupsapp
  labels:
    app: groupsapp-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: groupsapp-frontend
  template:
    metadata:
      labels:
        app: groupsapp-frontend
    spec:
      containers:
        - name: frontend
          image: 992646667898.dkr.ecr.us-east-1.amazonaws.com/frontend-groupsapp:v1
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: frontend-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: frontend-config
          configMap:
            name: groupsapp-frontend-config
---
