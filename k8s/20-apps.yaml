apiVersion: v1
kind: ConfigMap
metadata:
  name: groupsapp-frontend-config
  namespace: groupsapp
data:
  default.conf: |
    server {
      listen 80;
      server_name _;
      root /usr/share/nginx/html;
      index index.html;

      location / {
        try_files $uri $uri/ /index.html;
      }

      location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|webp|ico)$ {
        expires 1h;
        add_header Cache-Control "public";
        try_files $uri =404;
      }
    }
---
