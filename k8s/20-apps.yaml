apiVersion: apps/v1
kind: Deployment
metadata:
  name: groupsapp-messaging
  namespace: groupsapp
  labels:
    app: groupsapp-messaging
spec:
  replicas: 2
  selector:
    matchLabels:
      app: groupsapp-messaging
  template:
    metadata:
      labels:
        app: groupsapp-messaging
    spec:
      containers:
        - name: messaging
          image: 992646667898.dkr.ecr.us-east-1.amazonaws.com/messaging-groupsapp:v1
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 50051
          env:
